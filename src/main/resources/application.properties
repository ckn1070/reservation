spring.application.name=reservation
#
# Datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_RSV_DB_URL}
spring.datasource.username=${SPRING_RSV_DB_USERNAME}
spring.datasource.password=${SPRING_RSV_DB_PASSWORD}
#
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
#
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
#
# JWT
jwt.secret=${SPRING_RSV_JWT_SECRET}
jwt.access-token-validity=3600000
jwt.refresh-token-validity=604800000
#
# Swagger/OpenAPI
# Default Value
springdoc.api-docs.path=/v3/api-docs
# Default Value
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# Swagger Basic Auth (change in production!)
swagger.auth.username=${SWAGGER_AUTH_USERNAME:swagger-admin}
swagger.auth.password=${SWAGGER_AUTH_PASSWORD:swagger-secret-123}
#
# Scheduler
scheduler.release-expired-locks.interval=60000
#
# Logging
logging.level.com.drlom.reservation=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.flywaydb=DEBUG